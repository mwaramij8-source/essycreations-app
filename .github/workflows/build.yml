name: Build & Publish Essy Creations App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android

      - name: Restore signing key
        env:
          S1: ${{ secrets.ESSY_KEYSTORE_B64 }}
          S2: ${{ secrets.ESSY_KEYSTORE_PASSWORD }}
          S3: ${{ secrets.ESSYCREATIONS }}
        shell: python
        run: |
          import os, re, base64, subprocess
          tmp = os.environ["RUNNER_TEMP"]; ks = os.path.join(tmp, "essy-release.jks")
          vals = [os.environ.get(k, "") for k in ("S1", "S2", "S3")]
          keys, pws = [], []
          for v in vals:
              t = re.sub(r"\s+", "", v)
              runs = re.findall(r"[A-Za-z0-9+/]+=*", t)
              if runs and len(max(runs, key=len)) > 1000:
                  m = max(runs, key=len); keys.append(base64.b64decode(m + "=" * (-len(m) % 4)))
              # password candidates: every whitespace-separated token and the whole value
              pws += [t] + re.findall(r"[A-Za-z0-9]{8,}", v)
          ok = False
          for k in keys:
              open(ks, "wb").write(k)
              for pw in dict.fromkeys(p for p in pws if p and len(p) < 200):
                  if subprocess.run(["keytool", "-list", "-keystore", ks, "-storepass", pw, "-alias", "essy"], capture_output=True).returncode == 0:
                      with open(os.environ["GITHUB_ENV"], "a") as f:
                          f.write(f"ESSY_KEYSTORE={ks}\nESSY_KEYSTORE_PASSWORD={pw}\n")
                      print("Keystore OK"); ok = True; break
              if ok: break
          if not ok:
              print(f"::error::No valid keystore found (key candidates: {len(keys)}). Check the ESSY_KEYSTORE_B64 / ESSY_KEYSTORE_PASSWORD secrets.")
              raise SystemExit(1)

      - name: Build APK
        working-directory: android
        run: |
          mkdir -p ../out
          if [ -n "$ESSY_KEYSTORE" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../out/EssyCreations.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../out/EssyCreations.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: EssyCreations-Android
          path: out/EssyCreations.apk

      - name: Publish to GitHub Releases (download link used by the website)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Essy Creations App v1.0.${{ github.run_number }}
          body: Pakua EssyCreations.apk na uisakinishe kwenye simu ya Android.
          make_latest: true
          files: out/EssyCreations.apk
