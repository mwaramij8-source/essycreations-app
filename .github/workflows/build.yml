name: Build & Publish Essy Creations App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npx cap sync android

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ESSY_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/essy-release.jks"
            echo "ESSY_KEYSTORE=$RUNNER_TEMP/essy-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ESSY_KEYSTORE_B64 secret missing - building debug-signed APK"
          fi

      - name: Build APK
        working-directory: android
        env:
          ESSY_KEYSTORE_PASSWORD: ${{ secrets.ESSY_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ../out
          if [ -n "$ESSY_KEYSTORE" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../out/EssyCreations.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../out/EssyCreations.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: EssyCreations-Android
          path: out/EssyCreations.apk

      - name: Publish to GitHub Releases (download link used by the website)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Essy Creations App v1.0.${{ github.run_number }}
          body: Pakua EssyCreations.apk na uisakinishe kwenye simu ya Android.
          make_latest: true
          files: out/EssyCreations.apk
