name: Build & Publish Essy Creations App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ESSY_KEYSTORE_B64 }}
          KEYSTORE_PW: ${{ secrets.ESSY_KEYSTORE_PASSWORD || secrets.ESSYCREATIONS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # tolerate extra spaces / line breaks / labels pasted together with the key
            printf '%s' "$KEYSTORE_B64" | python3 -c "import sys,re,base64; t=re.sub(r'\\s+','',sys.stdin.read()); m=max(re.findall(r'[A-Za-z0-9+/]+=*',t),key=len); sys.stdout.buffer.write(base64.b64decode(m+'='*(-len(m)%4)))" > "$RUNNER_TEMP/essy-release.jks"
            PW=$(printf '%s' "$KEYSTORE_PW" | tr -d '[:space:]')
            if keytool -list -keystore "$RUNNER_TEMP/essy-release.jks" -storepass "$PW" -alias essy >/dev/null 2>&1; then
              echo "Keystore OK"
              echo "ESSY_KEYSTORE=$RUNNER_TEMP/essy-release.jks" >> "$GITHUB_ENV"
              echo "ESSY_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            else
              echo "::error::Keystore or password is wrong"; exit 1
            fi
          else
            echo "::warning::ESSY_KEYSTORE_B64 secret missing - building debug-signed APK"
          fi

      - name: Build APK
        working-directory: android
        run: |
          mkdir -p ../out
          if [ -n "$ESSY_KEYSTORE" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../out/EssyCreations.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../out/EssyCreations.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: EssyCreations-Android
          path: out/EssyCreations.apk

      - name: Publish to GitHub Releases (download link used by the website)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Essy Creations App v1.0.${{ github.run_number }}
          body: Pakua EssyCreations.apk na uisakinishe kwenye simu ya Android.
          make_latest: true
          files: out/EssyCreations.apk
